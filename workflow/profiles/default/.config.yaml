software-deployment-method:
  - apptainer
  - conda
apptainer-args: "--bind /storage,/home/user"
conda-prefix: /.snakemake/envs/smk_sv
scheduler: greedy
printshellcmds: True
keep-incomplete: True
cores: all
resources:
  mem_mb: 500000  # 500GB
default-resources:
  mem_mb: 10000  # 10GB
set-threads:
  annotsv: 10
  filter_annotations: 10
  clair3: 10
  cutesv: 10
  debreak: 10
  nanosv: 10
  nanovar: 10
  severus: 10
  snpeff: 10
  sniffles: 10
  svision: 10
  minimap2: 10
  minimap2_index: 10
  vep: 10
set-resources:
  minimap2_index:
    mem_mb: 50000  # 50GB
  minimap2:
    mem_mb: 200000  # 200GB
  clair3:
    mem_mb: 200000  # 200GB
  cutesv:
    mem_mb: 100000  # 100GB
  sniffles:
    mem_mb: 100000  # 100GB
  svim:
    mem_mb: 100000  # 100GB
  severus:
    mem_mb: 100000  # 100GB
  svision:
    mem_mb: 100000  # 100GB
    runtime: 72h
  snpeff:
    mem_mb: 50000  # 50GB
  annotsv:
    mem_mb: 50000  # 50GB
  filter_annotations:
    mem_mb: 50000  # 50GB
