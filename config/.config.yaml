run:
  dir: /projects/SV/analysis/wgs_t2t

workflow:
  mapper: minimap2
  callers:
    - cutesv
    - severus
    - sniffles
    - svim
    - svision
  annotators:
    - vep
    - snpeff
    - annotsv

inputs:
  # T2T-CHM13v2.0 analysis set, chr* names, including HG002-derived chrY.
  fasta: /doc/reference/T2T-CHM13v2.0/chm13v2.0.fa
  index_minimap2: /doc/reference/minimap2/T2T-CHM13v2.0/chm13v2.0.mmi
  dir_data: /projects/SV/data/wgs
  suffix_fastq: .fq.gz

filtering:
  # Unknown population frequency is retained and reported, never treated as AF=0.
  missing_population_af: keep
  min_reads: 3
  min_length_reads: 1000
  min_quality_mapping: 20
  min_coverage: 6
  min_size: 100
  max_size: 10000000
  min_dhffc: 0.7
  max_dhbfc: 1.3
  distance_sv:
    BND: 10
    DEL: 10
    INS: 10
    INV: 10
    DUP: 10
  n_callers:
    BND: 3
    DEL: 3
    INS: 3
    INV: 3
    DUP: 3
  consider_type:
    BND: false
    DEL: false
    INS: false
    INV: false
    DUP: false
  consider_strand:
    BND: false
    DEL: false
    INS: false
    INV: false
    DUP: false
  estimate_distance:
    BND: true
    DEL: true
    INS: true
    INV: true
    DUP: true

annotation:
  terms_relative: leuka?emia|blood|lymph|myelo|ha?ema|marrow|platel|thrombo|anemia|neutro
  species: homo_sapiens
  genome: CHM13
  # Build CHM13.v2.0 locally using the matching RefSeq/Liftoff annotation.
  snpeff:
    version: "v2.0"
    cache: /doc/snpeff
    build:
      genes: /doc/reference/T2T-CHM13v2.0/chm13v2.0_RefSeq_Liftoff_v5.3.gff
      format: gff3
      # Optional matching CDS/protein FASTAs enable SnpEff sequence cross-checks.
      # Without these, the build explicitly skips both checks (see build log).
      cds: null
      protein: null
  # Offline transcript annotation: no Ensembl cache or network connection required.
  vep:
    version: 116
    mode: gff
    annotation: /doc/reference/T2T-CHM13v2.0/chm13v2.0_GENCODEv35_CAT_Liftoff.vep.gff3
    max_size: 10000000
  annotsv:
    version: v3.5
    cache: /doc/tool/annotator/annotsv

caller_settings:
  tandem_repeats: /doc/reference/T2T-CHM13v2.0/chm13.bed
  nvtr: /doc/reference/T2T-CHM13v2.0/chm13.bed
  nanosv:
    config: /doc/nanosv/config.ini
    # Provide a CHM13 sampling BED before enabling NanoSV.
    bed: null
  clair3:
    model: /doc/clair3/models/pytorch/r941_prom_sup_g5014
  svision:
    model: /doc/svision/svision-cnn-model.ckpt

resources:
  # Pinned sources used by `snakemake resources`.
  downloads:
    reference:
      assemblies:
        CHM13:
          url: https://s3-us-west-2.amazonaws.com/human-pangenomics/T2T/CHM13/assemblies/analysis_set/chm13v2.0.fa.gz
          checksum: md5:06caded0055ec647a69acb708e13beff
          compression: gzip
    tandem_repeats:
      assemblies:
        CHM13:
          url: https://raw.githubusercontent.com/KolmogorovLab/Severus/54303063d8e828f493761d52fb7dd3cea8ae3fc7/vntrs/chm13.bed
          checksum: sha256:4e1f0dbf67c6930c93f772663ab7b40279fa6e487bd131effed8df7b33e2d902
    snpeff_genes:
      assemblies:
        CHM13:
          url: https://s3-us-west-2.amazonaws.com/human-pangenomics/T2T/CHM13/assemblies/annotation/chm13v2.0_RefSeq_Liftoff_v5.3.gff.gz
          checksum: sha256:4a4f67d57dcabd6b7fe6efc91bbd0751d6fdf952ea2c626c2a4fd62615f75eeb
          compression: gzip
    vep_genes:
      assemblies:
        CHM13:
          url: https://s3-us-west-2.amazonaws.com/human-pangenomics/T2T/CHM13/assemblies/annotation/chm13v2.0_GENCODEv35_CAT_Liftoff.vep.gff3.gz
          checksum: sha256:3ff94c1bcdaf8ca6625a17cc1984b92f80d2f339bcd3f077ad6b93849a35d5e9
          compression: gzip
    clair3_model:
      url: https://github.com/HKU-BAL/Clair3/releases/download/v2.0.2/clair3_models_v2.0.2.tar.gz
      checksum: sha256:27c7ea0777134567861e1f305a368d89a199332a1118a4f70df8bfebdbe1306b
      archive_root: models/r941_prom_sup_g5014
    svision_model:
