run:
  dir: /projects/SV/analysis/wgs

workflow:
  mapper: minimap2
  callers:
    - cutesv
    - severus
    - sniffles
    - svim
    - svision
  annotators:
    - vep
    - snpeff
    - annotsv

inputs:
  fasta: /doc/reference/fasta/GRCh38.primary_assembly.genome.fa
  index_minimap2: /doc/reference/minimap2/GRCh38/GRCh38.primary_assembly.genome.mmi
  dir_data: /projects/SV/data/wgs
  suffix_fastq: .fq.gz

filtering:
  min_reads: 3
  min_length_reads: 1000
  min_quality_mapping: 20
  min_coverage: 6
  min_size: 100
  max_size: 10000000
  min_dhffc: 0.7
  max_dhbfc: 1.3
  distance_sv:
    BND: 10
    DEL: 10
    INS: 10
    INV: 10
    DUP: 10
  n_callers:
    BND: 3
    DEL: 3
    INS: 3
    INV: 3
    DUP: 3
  consider_type:
    BND: false
    DEL: false
    INS: false
    INV: false
    DUP: false
  consider_strand:
    BND: false
    DEL: false
    INS: false
    INV: false
    DUP: false
  estimate_distance:
    BND: true
    DEL: true
    INS: true
    INV: true
    DUP: true

annotation:
  terms_relative: leuka?emia|blood|lymph|myelo|ha?ema|marrow|platel|thrombo|anemia|neutro
  species: homo_sapiens
  genome: GRCh38
  snpeff:
    version: "87"
    cache: /doc/snpeff
  vep:
    version: 114
    cache: /.vep
    max_size: 10000000
  annotsv:
    version: v3.5
    cache: /doc/tool/annotator/annotsv

caller_settings:
  tandem_repeats: /doc/sniffles/human_GRCh38_no_alt_analysis_set.trf.bed
  nvtr: /doc/sniffles/human_GRCh38_no_alt_analysis_set.trf.bed
  nanosv:
    config: /doc/nanosv/config.ini
    bed: /doc/nanosv/bedfiles/hg38_genome_sample.bed
  clair3:
    model: /doc/clair3/models/r941_prom_sup_g5014
  svision:
    model: /doc/svision/svision-cnn-model.ckpt

resources:
  # Pinned sources used by `snakemake resources`.
  downloads:
    reference:
      assemblies:
        GRCh38:
          url: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_48/GRCh38.primary_assembly.genome.fa.gz
          checksum: md5:42e38e8dd5027dd2ae8aeb8f3a990d07
          compression: gzip
    tandem_repeats:
      assemblies:
        GRCh38:
          url: https://raw.githubusercontent.com/fritzsedlazeck/Sniffles/684c7cb2f2f1d0a6dfe794617c661b1b7018c8c3/annotations/human_GRCh38_no_alt_analysis_set.trf.bed
          checksum: sha256:729cbb38bff84534070033db1ae004b6368f6856eef12dd7ce93e8ee55f37407
    clair3_model:
      url: https://www.bio8.cs.hku.hk/clair3/clair3_models/r941_prom_sup_g5014.tar.gz
      checksum: sha256:9d78abb9b0311cf634d15afc61c2b41f749b74cb9c4905e3544896ae70b9f70d
      archive_root: r941_prom_sup_g5014
    svision_model:
      url: https://drive.google.com/drive/folders/1j74IN6kPKEx9hy3aENx3zHYPUnyYWGvj
    nanosv_config:
      url: https://raw.githubusercontent.com/mroosmalen/nanosv/c1ae30cff5f1d978e198094db36c4be046d23846/nanosv/config.ini
      checksum: sha256:912b88436d7a4f60be1fe89409f4a884fa208aa7afe24b3dfa4a1acf3b92b8e8
    annotsv_human:
      url: https://www.lbgi.fr/~geoffroy/Annotations/Annotations_Human_3.5.tar.gz
      archive_root: Annotations_Human
    annotsv_exomiser:
      url: https://data.monarchinitiative.org/exomiser/data/2406_phenotype.zip
      checksum: md5:cfa476704db9a67c0f94d99eb67d0fd2
      version: "2406"
